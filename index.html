<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مُنجزي | رفيقك الدراسي وإدارة المهام المدرسية</title>
  <meta name="description" content="تطبيق عربي متكامل متعدد المستخدمين لإدارة المهام المدرسية والمواد والامتحانات ومساعد ذكي لتلخيص وتبسيط الدروس لطلاب المرحلة المتوسطة.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2v20'/><path d='M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'/></svg>">

  <!-- Google Fonts: Readex Pro & Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Readex Pro', 'sans-serif'],
            heading: ['Cairo', 'Readex Pro', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Main App Shell Grid -->
  <div class="min-h-screen flex flex-col md:flex-row">
    
    <!-- Desktop Sidebar (Hidden on Mobile) -->
    <aside class="hidden md:flex flex-col w-64 lg:w-72 bg-white dark:bg-slate-900 border-l border-slate-200/80 dark:border-slate-800 shrink-0 p-5 justify-between select-none z-30">
      
      <!-- Top Brand Section -->
      <div class="space-y-6">
        <div class="flex items-center gap-3 px-2">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-emerald-500/25 shrink-0">
            <i data-lucide="sparkles" class="w-6 h-6"></i>
          </div>
          <div>
            <span class="text-2xl font-black font-heading tracking-tight bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 bg-clip-text text-transparent">
              مُنجزي
            </span>
            <span class="block text-[11px] font-semibold text-slate-400 dark:text-slate-500">
              رفيقك المدرسي الذكي
            </span>
          </div>
        </div>

        <!-- Desktop Navigation Menu -->
        <nav class="space-y-1 pt-1 text-xs sm:text-sm">
          <a href="#dashboard" class="nav-link-desktop" data-tab="dashboard">
            <i data-lucide="layout-grid" class="w-4 h-4 shrink-0"></i>
            <span>الرئيسية</span>
          </a>

          <a href="#tasks" class="nav-link-desktop" data-tab="tasks">
            <i data-lucide="check-square" class="w-4 h-4 shrink-0"></i>
            <span>المهام والواجبات</span>
          </a>

          <a href="#subjects" class="nav-link-desktop" data-tab="subjects">
            <i data-lucide="book-marked" class="w-4 h-4 shrink-0"></i>
            <span>المواد الدراسية</span>
          </a>

          <a href="#exams" class="nav-link-desktop" data-tab="exams">
            <i data-lucide="calendar" class="w-4 h-4 shrink-0"></i>
            <span>الامتحانات والجدول</span>
          </a>

          <a href="#assistant" class="nav-link-desktop" data-tab="assistant">
            <div class="relative flex items-center justify-center">
              <i data-lucide="bot" class="w-4 h-4 shrink-0"></i>
              <span class="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            </div>
            <span>المساعد الذكي (AI)</span>
          </a>

          <a href="#plans" class="nav-link-desktop" data-tab="plans">
            <i data-lucide="crown" class="w-4 h-4 shrink-0 text-amber-500"></i>
            <span>باقات الاشتراك</span>
          </a>

          <a href="#stats" class="nav-link-desktop" data-tab="stats">
            <i data-lucide="trending-up" class="w-4 h-4 shrink-0"></i>
            <span>الإحصائيات والتقدم</span>
          </a>

          <!-- Admin Dashboard Link (Visible only to Admin role) -->
          <a href="#admin" class="nav-link-desktop admin-only-link hidden bg-purple-50 dark:bg-purple-950/40 text-purple-700 dark:text-purple-300" data-tab="admin">
            <i data-lucide="shield" class="w-4 h-4 shrink-0 text-purple-600"></i>
            <span>لوحة الإدارة 🛡️</span>
          </a>

          <a href="#profile" class="nav-link-desktop" data-tab="profile">
            <i data-lucide="user" class="w-4 h-4 shrink-0"></i>
            <span>الملف الشخصي</span>
          </a>
        </nav>
      </div>

      <!-- Bottom Sidebar Card & Info -->
      <div class="space-y-3 pt-3 border-t border-slate-100 dark:border-slate-800">
        <!-- Student Quick Profile Card -->
        <a href="#profile" class="nav-link-desktop p-2 rounded-2xl bg-slate-50 dark:bg-slate-800/50 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-between" data-tab="profile">
          <div class="flex items-center gap-2.5">
            <div id="header-user-avatar" class="w-8 h-8 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 text-white flex items-center justify-center font-bold text-xs shadow-sm">
              🎓
            </div>
            <div>
              <span id="header-user-name" class="text-xs font-bold text-slate-800 dark:text-slate-200 block truncate max-w-[110px]">
                طالب متميز
              </span>
              <span id="header-user-grade" class="text-[10px] text-slate-400 block">المرحلة المتوسطة</span>
            </div>
          </div>
          <span id="header-plan-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">FREE</span>
        </a>
      </div>

    </aside>

    <!-- Main Content Container -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">
      
      <!-- Top Application Header -->
      <header class="sticky top-0 z-20 glass-panel border-b border-slate-200/80 dark:border-slate-800/80 px-4 sm:px-8 py-3 flex items-center justify-between gap-4">
        
        <!-- Mobile Logo and Title (Visible on mobile only) -->
        <div class="flex items-center gap-2.5 md:hidden">
          <div class="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center shadow-md">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
          </div>
          <span class="font-extrabold font-heading text-base text-emerald-600 dark:text-emerald-400">
            مُنجزي
          </span>
        </div>

        <!-- Desktop Quick Status -->
        <div class="hidden md:flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>نظام مُنجزي السحابي نشط وآمن</span>
        </div>

        <!-- Header Actions -->
        <div class="flex items-center gap-2 mr-auto">
          
          <!-- Admin shortcut button (admin only) -->
          <button id="btn-header-admin" class="admin-only-link hidden py-1.5 px-3 bg-purple-100 text-purple-800 dark:bg-purple-950/60 dark:text-purple-300 hover:bg-purple-200 font-bold rounded-xl text-xs transition flex items-center gap-1.5">
            <i data-lucide="shield" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">الإدارة</span>
          </button>

          <!-- Quick Add Button -->
          <button id="btn-header-add-task" class="py-2 px-3 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold rounded-xl shadow-md shadow-emerald-600/20 text-xs transition flex items-center gap-1.5">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">+ مهمة</span>
          </button>

          <!-- Notification Bell with Badge & Dropdown -->
          <div class="relative">
            <button id="btn-notifications" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition relative" title="التنبيهات المدرسية">
              <i data-lucide="bell" class="w-4 h-4"></i>
              <span id="notif-badge" class="hidden absolute top-1 right-1 flex h-3.5 w-3.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                <span id="notif-count" class="relative inline-flex rounded-full h-3.5 w-3.5 bg-rose-500 text-white text-[8px] font-bold items-center justify-center">0</span>
              </span>
            </button>

            <!-- Notifications Dropdown Menu -->
            <div id="notif-dropdown" class="hidden absolute left-0 sm:left-auto sm:right-0 mt-2 w-80 sm:w-96 rounded-3xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-2xl z-40 animate-pop-in overflow-hidden">
              <div id="notif-content-area"></div>
            </div>
          </div>

          <!-- Dark / Light Theme Toggle -->
          <button id="btn-toggle-theme" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition" title="تبديل المظهر">
            <span id="theme-icon-slot">
              <i data-lucide="moon" class="w-4 h-4"></i>
            </span>
          </button>

          <!-- Profile Icon -->
          <button id="btn-header-profile" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition" title="الملف الشخصي">
            <i data-lucide="user" class="w-4 h-4"></i>
          </button>

        </div>

      </header>

      <!-- Main Content Outlet -->
      <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto safe-bottom">
        <div id="main-content-view">
          <!-- Views rendered by app.js router -->
        </div>
      </main>

    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 glass-panel border-t border-slate-200/80 dark:border-slate-800/80 px-2 py-2 flex items-center justify-around z-30 shadow-lg">
      
      <a href="#dashboard" class="nav-link-mobile p-1.5" data-tab="dashboard">
        <i data-lucide="layout-grid" class="w-5 h-5"></i>
        <span class="text-[10px] mt-1">الرئيسية</span>
      </a>

      <a href="#tasks" class="nav-link-mobile p-1.5" data-tab="tasks">
        <i data-lucide="check-square" class="w-5 h-5"></i>
        <span class="text-[10px] mt-1">المهام</span>
      </a>

      <a href="#subjects" class="nav-link-mobile p-1.5" data-tab="subjects">
        <i data-lucide="book-marked" class="w-5 h-5"></i>
        <span class="text-[10px] mt-1">المواد</span>
      </a>

      <a href="#assistant" class="nav-link-mobile p-1.5" data-tab="assistant">
        <div class="relative">
          <i data-lucide="bot" class="w-5 h-5"></i>
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 absolute -top-0.5 -right-0.5 animate-ping"></span>
        </div>
        <span class="text-[10px] mt-1">المساعد AI</span>
      </a>

      <a href="#stats" class="nav-link-mobile p-1.5" data-tab="stats">
        <i data-lucide="trending-up" class="w-5 h-5"></i>
        <span class="text-[10px] mt-1">الإحصائيات</span>
      </a>

    </nav>

  </div>

  <!-- Global Modals Container -->
  <div id="task-modal" class="hidden"></div>
  <div id="auth-modal" class="hidden"></div>

  <!-- Main JavaScript App Entry -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
